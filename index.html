<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandera Tech - Login</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --primary: #003366; /* Azul Escuro */
            --secondary: #00ccff; /* Ciano */
            --bg: #f0f4f8;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .logo-placeholder {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 30px;
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #002244;
        }

        .footer-link {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666;
            text-decoration: none;
            display: block;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #888;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }

        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="login-card">
        <span class="logo-placeholder">TANDERA TECH</span>
        
        <!-- GOOGLE ONE TAP -->
        <!-- IMPORTANTE: Substitua SEU_CLIENT_ID_AQUI pelo valor do Google Cloud Console -->
        <div id="g_id_onload"
             data-client_id="304833486282-mbsdapmb5u9t6t1r3ninp7j9nc9pgf6e.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="google-btn-container">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="center">
            </div>
        </div>

        <div class="divider">ou</div>

        <form id="loginForm">
            <div class="input-group">
                <label for="user">Usuário</label>
                <input type="text" id="user" placeholder="Digite seu usuário">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha">
            </div>

            <button type="button" onclick="testarLogin()">Entrar no Sistema</button>
        </form>

        <a href="#" class="footer-link">Esqueceu a senha? Contate o administrador.</a>
    </div>

    <script>
        const AUTH_API_URL = '/api/auth';

        // Lida com a resposta comum das rotas de auth
        async function processLoginResponse(response) {
            if (response.ok) {
                const data = await response.json();
                // Salvar Token, e-mail e IP do servidor específicos do usuário no Storage da Sessão
                sessionStorage.setItem('tandera_token', data.token);
                sessionStorage.setItem('tandera_serverIp', data.user.serverIp);
                sessionStorage.setItem('tandera_email', data.user.email);
                window.location.href = 'dashboard.html';
            } else {
                const error = await response.json();
                alert(error.message || 'Falha na autenticação.');
            }
        }

        // Callback invocado automaticamente pelo botão do Google
        async function handleCredentialResponse(response) {
            try {
                const res = await fetch(`${AUTH_API_URL}/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                await processLoginResponse(res);
            } catch (err) {
                console.error(err);
                alert('Erro de conexão com o servidor de autenticação (Node não iniciado).');
            }
        }

        // Login Tradicional (E-mail / Senha)
        async function testarLogin() {
            const emailInformado = document.getElementById('user').value;
            const senhaInformada = document.getElementById('password').value;

            if (!emailInformado || !senhaInformada) {
                return alert('Por favor, preencha e-mail e senha.');
            }

            try {
                const res = await fetch(`${AUTH_API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInformado, password: senhaInformada })
                });
                await processLoginResponse(res);
            } catch (err) {
                console.error(err);
                alert('Erro de conexão com o servidor de autenticação (Node não iniciado).');
            }
        }
    </script>

</body>
</html>
