<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandera Tech - Monitoramento Global de Câmeras</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --primary: #003366;
            --secondary: #00ccff;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --white: #ffffff;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --neutral: #64748b;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1600px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title-box h1 {
            color: var(--white);
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title-box p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .btn-outline:hover {
            background-color: var(--secondary);
            color: #000;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
            border-color: var(--secondary);
        }

        .btn-primary:hover {
            background-color: #002244;
        }

        .btn-danger {
            background-color: transparent;
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: var(--white);
        }

        /* Grade autoajustável pelo tamanho da tela */
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1600px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
            border-color: var(--secondary);
        }

        .client-header {
            background-color: rgba(0, 51, 102, 0.6);
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--secondary);
            letter-spacing: 0.8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .client-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #090d16;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .camera-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .offline-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #1a1010;
            color: var(--danger);
            text-align: center;
            padding: 20px;
        }

        .offline-placeholder svg {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
            fill: var(--danger);
        }

        .offline-placeholder span {
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .camera-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .camera-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }

        .badge {
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 6px;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .good {
            background-color: var(--success);
        }

        .bad {
            background-color: var(--danger);
        }

        .unknown {
            background-color: var(--warning);
            color: #000;
        }

        .offline {
            background-color: var(--neutral);
        }

        .timestamp-container {
            background-color: rgba(15, 23, 42, 0.7);
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ts-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .ts-value {
            font-size: 0.85rem;
            color: var(--secondary);
            font-weight: 600;
            font-family: monospace;
        }

        .loading-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--secondary);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--secondary);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-title-box">
            <h1>📷 Monitoramento de Câmeras</h1>
            <p id="subtitulo">Conectando aos servidores MongoDB...</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
            <button class="btn btn-primary" onclick="carregarTodasAsCameras()">🔄 Atualizar Agora</button>
            <button class="btn btn-danger" onclick="fazerLogout()">SAIR</button>
        </div>
    </div>

    <div class="camera-grid" id="cameraGrid">
        <div class="loading-box">
            <div class="spinner"></div>
            Carregando câmeras e servidores em tempo real...
        </div>
    </div>

    <script>
        // Verificação de Segurança
        const token = sessionStorage.getItem('tandera_token');
        if (!token) {
            window.location.replace('index.html');
        }

        // Função auxiliar para extrair e-mail do token JWT caso não esteja no sessionStorage
        function obterEmailDoToken(jwtToken) {
            try {
                const payloadBase64 = jwtToken.split('.')[1];
                const decodificado = atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'));
                const payload = JSON.parse(decodeURIComponent(escape(decodificado)));
                return payload.email ? payload.email.toLowerCase() : null;
            } catch (e) {
                return null;
            }
        }

        // Bloquear acesso a usuários que não sejam o gestor
        const userEmail = sessionStorage.getItem('tandera_email') || obterEmailDoToken(token);
        if (!userEmail || userEmail.toLowerCase() !== 'marcelo.leite.engcivil@gmail.com') {
            alert('Acesso negado: esta página é restrita para o gestor.');
            window.location.replace('dashboard.html');
        }

        function fazerLogout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        const AUTH_API = '/api/auth/servers';

        function deduplicarServidores(lista) {
            const mapa = new Map();
            for (const item of lista) {
                if (!item || !item.serverIp) continue;
                const cleanIp = item.serverIp.trim().replace(/\/+$/, '');

                if (!mapa.has(cleanIp)) {
                    mapa.set(cleanIp, { ...item, serverIp: cleanIp });
                } else {
                    const existente = mapa.get(cleanIp);
                    const isGenericName = (name) => /google|administrador|local|agent/i.test(name || '');
                    if (isGenericName(existente.name) && !isGenericName(item.name)) {
                        mapa.set(cleanIp, { ...item, serverIp: cleanIp });
                    }
                }
            }
            return Array.from(mapa.values());
        }

        async function obterListaServidores() {
            try {
                const response = await fetch(AUTH_API);
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        return deduplicarServidores(data);
                    }
                }
            } catch (err) {
                console.warn("Falha ao buscar lista de servidores do backend Auth, utilizando fallback:", err);
            }

            // Fallback: usar o serverIp armazenado na sessão do usuário caso backend esteja indisponível
            const userServerIp = sessionStorage.getItem('tandera_serverIp');
            if (userServerIp) {
                return [{
                    name: 'Servidor Local / Padrão',
                    serverIp: userServerIp
                }];
            }

            return [];
        }

        function criarCardOfflineHTML(idCard, clientName, cameraName, mensagem = "IMAGEM OFFLINE") {
            return `
                <div class="card" id="${idCard}">
                    <div class="client-header">
                        <span class="client-name">${clientName}</span>
                    </div>
                    <div class="image-container">
                        <div class="offline-placeholder">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                            </svg>
                            <span>${mensagem}</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="camera-info">
                            <h3 class="camera-title">${cameraName}</h3>
                            <span class="badge offline">OFFLINE</span>
                        </div>
                        <div class="timestamp-container">
                            <span class="ts-label">ÚLTIMA ATUALIZAÇÃO</span>
                            <span class="ts-value">Servidor Indisponível</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function lidarComErroImagem(imgElement, clientName, cameraName) {
            const container = imgElement.parentElement;
            container.innerHTML = `
                <div class="offline-placeholder">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span>IMAGEM OFFLINE</span>
                </div>
            `;
        }

        async function processarServidor(servidor, gridElement) {
            const serverIp = servidor.serverIp;
            const clientName = servidor.name || 'Servidor Tandera';

            try {
                // Tenta buscar as câmeras do servidor com timeout de 5 segundos
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const response = await fetch(`${serverIp}/cameras`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("Falha HTTP no servidor");
                const cameras = await response.json();

                if (!Array.isArray(cameras) || cameras.length === 0) {
                    gridElement.innerHTML += criarCardOfflineHTML(
                        `card-offline-${Math.random().toString(36).substr(2, 9)}`,
                        clientName,
                        'CÂMERA 1',
                        'NENHUMA CÂMERA'
                    );
                    return;
                }

                for (const cam of cameras) {
                    const cID = cam._id;
                    const htmlId = `cam-${cID}-${Math.random().toString(36).substr(2, 5)}`;
                    const cameraName = (cam.name || 'CÂMERA').toUpperCase();

                    const cardHTML = `
                        <div class="card" id="card-${htmlId}">
                            <div class="client-header">
                                <span class="client-name">${clientName}</span>
                            </div>
                            <div class="image-container" id="img-container-${htmlId}">
                                <img id="img-${htmlId}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" 
                                     alt="${cameraName}" 
                                     class="camera-img"
                                     onerror="lidarComErroImagem(this, '${clientName}', '${cameraName}')">
                            </div>
                            <div class="card-body">
                                <div class="camera-info">
                                    <h3 class="camera-title">${cameraName}</h3>
                                    <span id="badge-${htmlId}" class="badge offline">CARREGANDO...</span>
                                </div>
                                <div class="timestamp-container">
                                    <span class="ts-label">ÚLTIMA ATUALIZAÇÃO</span>
                                    <span id="time-${htmlId}" class="ts-value">--/--/---- --:--:--</span>
                                </div>
                            </div>
                        </div>
                    `;

                    gridElement.innerHTML += cardHTML;

                    // Busca o último status/detecção da câmera assincronamente
                    fetchUltimaInferencia(serverIp, cID, htmlId, clientName, cameraName);
                }

            } catch (err) {
                console.warn(`Servidor offline ou inacessível (${clientName} - ${serverIp}):`, err);
                gridElement.innerHTML += criarCardOfflineHTML(
                    `card-offline-${Math.random().toString(36).substr(2, 9)}`,
                    clientName,
                    'CÂMERA 1',
                    'IMAGEM OFFLINE'
                );
            }
        }

        async function fetchUltimaInferencia(serverIp, cID, htmlId, clientName, cameraName) {
            try {
                const infoURL = `${serverIp}/blocks/camera/${cID}/latest`;
                const response = await fetch(infoURL);
                if (!response.ok) throw new Error("Erro na requisição da inferência");
                const data = await response.json();

                const blockId = data._id || data.id;
                if (!blockId) throw new Error("ID do bloco não encontrado");

                const imgElem = document.getElementById(`img-${htmlId}`);
                if (imgElem) {
                    imgElem.src = `${serverIp}/blocks/${blockId}/image?t=${Date.now()}`;
                }

                const timeElem = document.getElementById(`time-${htmlId}`);
                if (timeElem && data.updated) {
                    timeElem.innerText = new Date(data.updated).toLocaleString('pt-BR');
                }

                const badgeElem = document.getElementById(`badge-${htmlId}`);
                if (badgeElem) {
                    const label = data.inferedLabel || '';
                    const conf = data.confidance !== undefined ? (data.confidance * 100).toFixed(1) : '0.0';

                    if (label === "Good" || label === "OK") {
                        badgeElem.innerText = `BOM (${conf}%)`;
                        badgeElem.className = "badge good";
                    } else if (label === "Unknown") {
                        badgeElem.innerText = `INCERTO (${conf}%)`;
                        badgeElem.className = "badge unknown";
                    } else if (label === "Bad" || label === "NOK") {
                        badgeElem.innerText = `RUIM (${conf}%)`;
                        badgeElem.className = "badge bad";
                    } else {
                        badgeElem.innerText = `${label.toUpperCase()} (${conf}%)`;
                        badgeElem.className = "badge unknown";
                    }
                }
            } catch (err) {
                const badgeElem = document.getElementById(`badge-${htmlId}`);
                if (badgeElem) {
                    badgeElem.innerText = 'OFFLINE';
                    badgeElem.className = 'badge offline';
                }
                const timeElem = document.getElementById(`time-${htmlId}`);
                if (timeElem) {
                    timeElem.innerText = 'Servidor Indisponível';
                }
                const imgElem = document.getElementById(`img-${htmlId}`);
                if (imgElem) {
                    lidarComErroImagem(imgElem, clientName, cameraName);
                }
            }
        }

        async function carregarTodasAsCameras() {
            const grid = document.getElementById('cameraGrid');
            const subtitulo = document.getElementById('subtitulo');
            
            grid.innerHTML = `
                <div class="loading-box">
                    <div class="spinner"></div>
                    Buscando servidores e câmeras ativas...
                </div>
            `;

            const servidores = await obterListaServidores();

            if (servidores.length === 0) {
                grid.innerHTML = `<h3 style="grid-column: 1/-1; text-align:center; color: var(--danger);">Nenhum servidor encontrado no sistema.</h3>`;
                subtitulo.innerText = "Nenhum servidor ativo.";
                return;
            }

            subtitulo.innerText = `Monitorando ${servidores.length} cliente(s) / servidor(es) ativo(s)`;
            grid.innerHTML = ''; // Limpa spinner

            for (const servidor of servidores) {
                await processarServidor(servidor, grid);
            }
        }

        window.onload = () => {
            carregarTodasAsCameras();
            // Atualiza automaticamente a cada 30 segundos
            setInterval(carregarTodasAsCameras, 30000);
        };
    </script>
</body>

</html>
