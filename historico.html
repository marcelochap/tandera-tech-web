<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tandera Tech - Histórico de Produção</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #003366; --secondary: #00ccff; --bg: #f4f7f9;
            --white: #ffffff; --danger: #ff4d4d; --success: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg); margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            width: 100%; max-width: 900px; background: var(--white);
            padding: 20px; border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); box-sizing: border-box;
        }

        .btn-back {
            background-color: transparent; border: 1px solid var(--primary);
            color: var(--primary); padding: 8px 15px; border-radius: 8px;
            cursor: pointer; font-weight: bold; margin-bottom: 20px;
            display: inline-flex; align-items: center; gap: 5px;
            text-decoration: none; font-size: 0.9rem;
        }

        .btn-back:hover { background-color: var(--primary); color: white; }

        h2 { color: var(--primary); text-align: center; margin-top: 0; }

        .filter-section {
            display: flex; flex-wrap: wrap; gap: 10px;
            justify-content: center; align-items: flex-end;
            margin-bottom: 30px; padding: 15px;
            background: #f8f9fa; border-radius: 10px;
        }

        .filter-group { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
        label { font-size: 0.75rem; font-weight: bold; color: #555; margin-bottom: 5px; }

        input[type="date"] {
            padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit;
        }

        .btn-filter {
            background: var(--primary); color: white; border: none;
            padding: 12px 25px; border-radius: 6px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }

        .btn-filter:disabled { background: #ccc; cursor: not-allowed; }

        .chart-wrapper { position: relative; height: 60vh; width: 100%; }

        #loading {
            display: none; text-align: center; color: var(--primary);
            font-weight: bold; margin-bottom: 10px; font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="btn-back" onclick="window.location.href='dashboard.html'">
            ← Voltar para Início
        </button>

        <h2 id="pageTitulo">Produção Tandera Tech</h2>

        <div class="filter-section">
            <div class="filter-group">
                <label>INÍCIO</label>
                <input type="date" id="startDate">
            </div>
            <div class="filter-group">
                <label>FIM</label>
                <input type="date" id="endDate">
            </div>
            <button id="btnFiltrar" class="btn-filter" onclick="executarFiltro()">FILTRAR</button>
        </div>

        <div id="loading">Consultando dados seguros no servidor...</div>

        <div class="chart-wrapper">
            <canvas id="productionChart"></canvas>
        </div>
    </div>

    <script>
        // =====================================================
        // FASE 1 - VERIFICAÇÃO DE SEGURANÇA (OBRIGATÓRIA)
        // =====================================================
        const token = sessionStorage.getItem('tandera_token');
        const userServerIp = sessionStorage.getItem('tandera_serverIp');

        if (!token || !userServerIp) {
            // Sem sessão válida: retorna para login
            window.location.replace('index.html');
        }

        // =====================================================
        // FASE 2 - RESOLUÇÃO DINÂMICA DA CÂMERA ALVO
        // =====================================================

        // Leitura dos parâmetros da URL (passados pelo botão "Ver Histórico" no dashboard)
        const urlParams = new URLSearchParams(window.location.search);
        let cameraId = urlParams.get('camera');
        let cameraNome = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : null;

        // FALLBACK: Se a URL não trouxer o ID, tenta recuperar a primeira câmera do cache de sessão
        if (!cameraId) {
            try {
                const cacheRaw = sessionStorage.getItem('tandera_cameras');
                if (cacheRaw) {
                    // Replicação da cifra XOR usada no dashboard para descriptografar o cache
                    const CHAVE_SECRETA = token.substring(token.length - 12);

                    function xorCipherD(hash) {
                        const decoded = decodeURIComponent(atob(hash));
                        let res = '';
                        for (let i = 0; i < decoded.length; i++) {
                            res += String.fromCharCode(decoded.charCodeAt(i) ^ CHAVE_SECRETA.charCodeAt(i % CHAVE_SECRETA.length));
                        }
                        return res;
                    }

                    const cameras = JSON.parse(xorCipherD(cacheRaw));
                    if (cameras && cameras.length > 0) {
                        cameraId = cameras[0]._id;
                        cameraNome = cameras[0].name;
                        console.log(`[Historico] Fallback: usando câmera padrão "${cameraNome}" (${cameraId})`);
                    }
                }
            } catch (e) {
                console.warn('[Historico] Falha ao ler cache de câmeras:', e);
            }
        }

        // BARREIRA FINAL: Se mesmo com o fallback não tiver câmera, redireciona para o dashboard
        if (!cameraId) {
            alert('Acesso Restrito: Nenhuma câmera encontrada. Retornando ao painel.');
            window.location.replace('dashboard.html');
        }

        // =====================================================
        // FASE 3 - CONFIGURAÇÃO DA PÁGINA
        // =====================================================

        // Atualiza o título com o nome da câmera selecionada
        const nomeTitulo = cameraNome ? cameraNome.toUpperCase() : 'MÁQUINA';
        document.getElementById('pageTitulo').innerText = `Produção — ${nomeTitulo}`;

        const serverURL = userServerIp;
        let meuGrafico;

        // =====================================================
        // FASE 4 - LÓGICA DE FETCH E GRÁFICO
        // =====================================================

        function inicializarOuAtualizarGrafico(labels, dadosBoas, dadosTotais) {
            const ctx = document.getElementById('productionChart').getContext('2d');
            if (meuGrafico) meuGrafico.destroy();

            meuGrafico = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Placas Boas',
                            data: dadosBoas,
                            backgroundColor: 'rgba(0, 51, 102, 0.7)',
                            borderColor: 'rgba(0, 51, 102, 1)',
                            fill: true, tension: 0, pointRadius: 4
                        },
                        {
                            label: 'Total Produzido',
                            data: dadosTotais,
                            backgroundColor: 'rgba(255, 77, 77, 0.7)',
                            borderColor: 'rgba(255, 77, 77, 1)',
                            fill: '-1', tension: 0, pointRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Quantidade de Placas' }
                        }
                    },
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        async function consultarDia(dataIso) {
            // Formata as datas com o sufixo de fuso horário solicitado pela API
            const startStr = `${dataIso}T00:00:00[-03:00]`;
            const endStr = `${dataIso}T23:59:59[-03:00]`;

            // URL dinâmica usando o cameraId resolvido no início do script
            const url = `${serverURL}/blocks/camera/${cameraId}/date-range/summary?start=${encodeURIComponent(startStr)}&end=${encodeURIComponent(endStr)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Falha na resposta do servidor');
                const data = await response.json();

                return {
                    label: dataIso.split('-').reverse().slice(0, 2).join('/'),
                    boas: parseInt(data.goodBlocksCount) || 0,
                    total: parseInt(data.blocksCount) || 0
                };
            } catch (error) {
                console.error("Erro na data " + dataIso, error);
                return {
                    label: dataIso.split('-').reverse().slice(0, 2).join('/'),
                    boas: 0,
                    total: 0
                };
            }
        }

        async function executarFiltro() {
            const dataInicioStr = document.getElementById('startDate').value;
            const dataFimStr = document.getElementById('endDate').value;

            if (!dataInicioStr || !dataFimStr) {
                alert("Por favor, selecione as datas de início e fim.");
                return;
            }

            const loading = document.getElementById('loading');
            const btn = document.getElementById('btnFiltrar');

            loading.style.display = 'block';
            btn.disabled = true;

            const labels = [];
            const dadosBoas = [];
            const dadosTotais = [];
            const promessas = [];

            let dataAtual = new Date(dataInicioStr + "T00:00:00");
            const dataFim = new Date(dataFimStr + "T00:00:00");

            if (dataFim < dataAtual) {
                alert("A data final não pode ser menor que a inicial.");
                loading.style.display = 'none';
                btn.disabled = false;
                return;
            }

            // Loop para coletar dados dia a dia
            while (dataAtual <= dataFim) {
                const dataIso = dataAtual.toISOString().split('T')[0];
                promessas.push(consultarDia(dataIso));
                dataAtual.setDate(dataAtual.getDate() + 1);
            }

            try {
                // Execução paralela para alta performance
                const resultados = await Promise.all(promessas);

                resultados.forEach(res => {
                    labels.push(res.label);
                    dadosBoas.push(res.boas);
                    dadosTotais.push(res.total);
                });

                inicializarOuAtualizarGrafico(labels, dadosBoas, dadosTotais);
            } catch (err) {
                console.error("Erro ao buscar histórico:", err);
                alert("Erro ao conectar com o servidor seguro.");
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        window.onload = () => {
            const hoje = new Date();
            const semanaPassada = new Date();
            semanaPassada.setDate(hoje.getDate() - 6);

            document.getElementById('startDate').value = semanaPassada.toISOString().split('T')[0];
            document.getElementById('endDate').value = hoje.toISOString().split('T')[0];

            executarFiltro();
        };
    </script>
</body>
</html>
